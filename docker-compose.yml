services:
  firebase-emulators:
    build:
      context: .
      dockerfile: docker/firebase-emulators.Dockerfile
    working_dir: /workspace
    ports:
      - "${FIREBASE_EMULATOR_UI_HOST_PORT:-4000}:4000"
      - "${FIREBASE_DATABASE_EMULATOR_HOST_PORT:-9000}:9000"
      - "${FIREBASE_AUTH_EMULATOR_HOST_PORT:-9099}:9099"
    environment:
      FIREBASE_EMULATOR_EXPORT_DIR: ${FIREBASE_EMULATOR_EXPORT_DIR:-emulator-data}
    volumes:
      - ./:/workspace
      - firebase-emulator-cache:/root/.cache/firebase/emulators

volumes:
  firebase-emulator-cache:
